version: '3.9'

services:
  redis-master:
    image: redis:7
    container_name: redis-master
    ports:
      - "6379:6379"
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - /d/redis_data/master:/data
      - ./redis-master.conf:/usr/local/etc/redis/redis.conf
    networks:
      redisnet:
        ipv4_address: 172.18.0.2
    
  redis-slave1:
    image: redis:7
    container_name: redis-slave1
    ports:
      - "6380:6379"
    depends_on:
      - redis-master
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      # - /d/redis_data/slave1:/data
      - redis_slave1_data:/data
      # - /d/redis_data/redis_slave1_data:/data
      - ./redis-slave1.conf:/usr/local/etc/redis/redis.conf
    networks:
      redisnet:
        ipv4_address: 172.18.0.6
        

  redis-slave2:
    image: redis:7
    container_name: redis-slave2
    ports:
      - "6381:6379"
    depends_on:
      - redis-master
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      # - /d/redis_data/slave2:/data
      - redis_slave2_data:/data
      # - /d/redis_data/redis_slave2_data:/data
      - ./redis-slave2.conf:/usr/local/etc/redis/redis.conf
    networks:
      redisnet:
        ipv4_address: 172.18.0.7

  sentinel1:
    build:
      context: .
      dockerfile: Dockerfile.sentinel
    container_name: sentinel1
    depends_on:
      - redis-master
    networks:
      redisnet:
        ipv4_address: 172.18.0.8
    ports:
      - "26379:26379"

  sentinel2:
    build:
      context: .
      dockerfile: Dockerfile.sentinel
    container_name: sentinel2
    depends_on:
      - redis-master
    networks:
      redisnet:
        ipv4_address: 172.18.0.9
    ports:
      - "26380:26379"

  sentinel3:
    build:
      context: .
      dockerfile: Dockerfile.sentinel
    container_name: sentinel3
    depends_on:
      - redis-master
    networks:
      redisnet:
        ipv4_address: 172.18.0.10
    ports:
      - "26381:26379"

  web:
      build:
        context: .
        dockerfile: Dockerfile.web
      container_name: queue_viewer
      ports:
        - "5000:5000"
      environment:
        - REDIS_HOST=redis-master
        - REDIS_PORT=6379
        - ALLOWED_QUEUES=LotActions_processing_queue,LotActions_failed_queue,LineNotify_failed_queue,prober_worker_status,prober_processing_queue,LineNotify_retry_queue,prober_dispatched_log,prober_failed_queue,LotActions_retry_queue,LotActions_worker_status,LineNotify_worker_status,LineNotify_processing_queue,LineNotify_task_queue,LotActions_dispatched_log,prober_retry_queue,LineNotify_dispatched_log,prober_task_queue,LotActions_task_queue
        - REDIS_MASTER_NAME=mymaster
        - POSTGRES_HOST=postgres
        - POSTGRES_PORT=5432
        - POSTGRES_DB=queue_system
        - POSTGRES_USER=queue_admin
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-please-change-me}
      depends_on:
        - redis-master
        - postgres
      networks:
        redisnet:
          ipv4_address: 172.18.0.3
      volumes:
        - .:/app

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=queue_system
      - POSTGRES_USER=queue_admin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-please-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 不再掛載 schema.sql：所有核心資料表（users/equipments/contacts/
      # equipment_history/task_history/worker_status_history/contacts_history）
      # 已改成 read_queue.py 啟動時用 CREATE TABLE IF NOT EXISTS 自動檢查建立，
      # 詳見 init_core_schema() / init_worker_status_history_schema() /
      # init_contacts_history_schema()，不再依賴這個只在 volume 全新時才生效的機制。
    networks:
      redisnet:
        ipv4_address: 172.18.0.4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queue_admin -d queue_system"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 橋接服務：在 worker 端程式改成直接寫 task_history 之前，
  # 先把 Redis 的 dispatched_log / failed_queue 同步進 PostgreSQL。
  # 詳見 sync_history_to_postgres.py 開頭的說明。
  history-sync:
      build:
        context: .
        dockerfile: Dockerfile.web
      container_name: history_sync
      command: ["python", "sync_history_to_postgres.py"]
      environment:
        - REDIS_SENTINELS=sentinel1:26379,sentinel2:26379,sentinel3:26379
        - POSTGRES_HOST=postgres
        - POSTGRES_PORT=5432
        - POSTGRES_DB=queue_system
        - POSTGRES_USER=queue_admin
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-please-change-me}
      depends_on:
        - redis-master
        - postgres
      networks:
        redisnet:
          ipv4_address: 172.18.0.5
      volumes:
        - .:/app

networks:
  redisnet:
    external: true
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16


volumes:
  redis_slave1_data:
  redis_slave2_data:
  postgres_data:

# 建立networks  
# docker network create redisnet  
# docker network create --driver bridge --subnet 172.18.0.0/16 redisnet

