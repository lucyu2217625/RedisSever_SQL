{% extends "layout.html" %}

{% block title %}RPA 腳本更新 - Redis 佇列管理系統{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-lg font-semibold text-gray-800">腳本更新</h1>
    </div>

    <form method="POST" class="space-y-6">
        <div class="card p-6">
            <h2 class="text-sm font-semibold text-gray-700 mb-4">API 參數</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1">Source Path</label>
                    <input type="text" name="source_path" required class="text-sm border border-gray-300 rounded-md px-3 py-2 w-full focus:outline-none focus:ring-2 focus:ring-blue-400">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1">Target Path</label>
                    <input type="text" name="target_path" required class="text-sm border border-gray-300 rounded-md px-3 py-2 w-full focus:outline-none focus:ring-2 focus:ring-blue-400">
                </div>
            </div>
        </div>

        <div class="card overflow-hidden">
            <div class="bg-gray-50 px-4 py-3 border-b border-gray-200">
                <h2 class="text-xs font-bold text-gray-600 uppercase tracking-widest">選擇 RPA</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-white border-b border-gray-100">
                            <th class="p-3 text-xs font-bold text-gray-600 uppercase">選擇</th>
                            <th class="p-3 text-xs font-bold text-gray-600 uppercase">RPA 名稱</th>
                            <th class="p-3 text-xs font-bold text-gray-600 uppercase">狀態</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100">
                        {% for rpa in rpa_list %}
                        <tr class="hover:bg-gray-50">
                            <td class="p-3">
                                <input type="checkbox" name="rpa" value="{{ rpa.name }}" class="rounded text-blue-600 focus:ring-blue-500">
                            </td>
                            <td class="p-3 text-sm font-mono text-gray-700">{{ rpa.name }}</td>
                            <td class="p-3 text-sm text-gray-600">{{ rpa.status }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>

        <div class="flex justify-end">
            <button type="submit" class="btn-primary">
                <i class="fas fa-paper-plane mr-1"></i>發送指令
            </button>
        </div>
    </form>
</div>
{% endblock %}
