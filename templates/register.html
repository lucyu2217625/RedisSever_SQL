{% extends "layout.html" %}

{% block title %}帳號管理 - Redis 佇列管理系統{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-lg font-semibold text-gray-800">帳號管理</h1>
  </div>

  <div class="card p-6 mb-6">
    <h2 class="text-sm font-semibold text-gray-700 mb-4">新增使用者</h2>
    <form method="POST" class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
      <div class="md:col-span-1">
        <label for="username" class="block text-xs font-medium text-gray-500 mb-1">使用者名稱</label>
        <input type="text" id="username" name="username" required class="text-sm border border-gray-300 rounded-md w-full px-3 py-2 focus:ring-2 focus:ring-blue-400 outline-none">
      </div>
      <div class="md:col-span-1">
        <label for="password" class="block text-xs font-medium text-gray-500 mb-1">密碼</label>
        <input type="password" id="password" name="password" required class="text-sm border border-gray-300 rounded-md w-full px-3 py-2 focus:ring-2 focus:ring-blue-400 outline-none">
      </div>
      <div class="md:col-span-1">
        <label for="role" class="block text-xs font-medium text-gray-500 mb-1">角色</label>
        <select id="role" name="role" class="text-sm border border-gray-300 rounded-md w-full px-3 py-2 focus:ring-2 focus:ring-blue-400 outline-none">
          <option value="viewer">viewer</option>
          <option value="admin">admin</option>
        </select>
      </div>
      <button type="submit" class="btn-primary">
        <i class="fas fa-user-plus mr-1"></i>新增
      </button>
    </form>
  </div>

  <div class="card overflow-hidden">
    <div class="bg-gray-50 px-4 py-3 border-b border-gray-200">
      <h2 class="text-xs font-bold text-gray-600 uppercase tracking-widest">現有使用者</h2>
    </div>
    <table class="w-full text-left border-collapse">
      <thead>
        <tr class="bg-white border-b border-gray-100">
          <th class="p-3 text-xs font-bold text-gray-600 uppercase">使用者名稱</th>
          <th class="p-3 text-xs font-bold text-gray-600 uppercase">角色</th>
          <th class="p-3 text-xs font-bold text-gray-600 uppercase">修改密碼</th>
          <th class="p-3 text-xs font-bold text-gray-600 uppercase">操作</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100">
        {% for user in user_list %}
        <tr class="hover:bg-gray-50">
          <td class="p-3 text-sm font-medium text-gray-800">{{ user.username }}</td>
          <td class="p-3 text-sm text-gray-600">{{ user.role }}</td>
          <td class="p-3">
            <form action="{{ url_for('update_user_password') }}" method="POST" class="flex flex-wrap items-center gap-2" onsubmit="return confirm('確定要更新 {{ user.username }} 的密碼嗎？');">
              <input type="hidden" name="username" value="{{ user.username }}">
              <input type="password" name="new_password" required placeholder="輸入新密碼" class="text-sm border border-gray-300 rounded-md px-3 py-1.5 focus:ring-2 focus:ring-blue-400 outline-none min-w-[160px]">
              <button type="submit" class="btn-secondary btn-sm">
                <i class="fas fa-key mr-1"></i>更新
              </button>
            </form>
          </td>
          <td class="p-3">
            {% if user.username != 'admin' %}
            <form action="{{ url_for('delete_user') }}" method="POST" onsubmit="return confirm('你確定要刪除 {{ user.username }} 嗎？');">
              <input type="hidden" name="username" value="{{ user.username }}">
              <button type="submit" class="btn-danger-subtle btn-sm">
                <i class="fas fa-trash mr-1"></i>刪除
              </button>
            </form>
            {% else %}
            <span class="text-xs text-gray-400">保留</span>
            {% endif %}
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
